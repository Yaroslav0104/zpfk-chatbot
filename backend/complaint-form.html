<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Форма скарги</title>
</head>
<body>
  <h2>Подати скаргу</h2>

  <form action="create-complaint.php" method="POST">
    <div>
      <label>ПІБ:</label><br>
      <input type="text" name="full_name">
    </div>

    <br>

    <div>
      <label>Група:</label><br>
      <input type="text" name="student_group">
    </div>

    <br>

    <div>
      <label>Категорія:</label><br>
      <select name="category">
        <option value="schedule">Розклад</option>
        <option value="teacher">Викладач</option>
        <option value="administration">Адміністрація</option>
        <option value="technical_issue">Технічна проблема</option>
        <option value="other">Інше</option>
      </select>
    </div>

    <br>

    <div>
      <label>Тема:</label><br>
      <input type="text" name="subject" required>
    </div>

    <br>

    <div>
      <label>Текст скарги:</label><br>
      <textarea name="message" rows="6" cols="50" required></textarea>
    </div>

    <br>

    <div>
      <label>
        <input type="checkbox" name="is_anonymous" value="1">
        Подати анонімно
      </label>
    </div>

    <br>

    <button type="submit">Надіслати скаргу</button>
  </form>
</body>
</html>
